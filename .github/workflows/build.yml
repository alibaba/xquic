name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  harness-check:

    name: Harness Check

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2

    - name: Capture pull request body
      if: github.event_name == 'pull_request'
      env:
        XQC_PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        printf '%s\n' "$XQC_PR_BODY" > "$RUNNER_TEMP/pr_body.md"

    - name: Check agent harness
      run: |
        if [ -f "$RUNNER_TEMP/pr_body.md" ]; then
          XQC_PR_BODY_PATH="$RUNNER_TEMP/pr_body.md" \
            bash harness/scripts/xqc_harness_check.sh
        else
          bash harness/scripts/xqc_harness_check.sh
        fi

  build-ubuntu:

    name: Build on Ubuntu

    needs: harness-check

    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on: [ubuntu-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        submodules: 'recursive'

    - name: Linux Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libevent-dev

    - name: Cunit Setup
      run: |
        sudo apt-get install -y libcunit1 libcunit1-doc libcunit1-dev

    - name: Gcov Setup
      run: |
        sudo apt-get install -y python3-pip
        sudo apt-get install -y python3-lxml
        sudo pip3 install gcovr

    - name: Update Submodule
      run: |
        git submodule update --init --recursive

    - name: Build BoringSSL
      run: |
        git clone https://github.com/google/boringssl.git ./third_party/boringssl
        cd ./third_party/boringssl
        mkdir -p build
        cd build
        cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
        make ssl crypto

    - name: Build XQUIC
      run: |
        SSL_TYPE_STR="boringssl"
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        SSL_INC_PATH_STR="${PWD}/third_party/boringssl/include"
        SSL_LIB_PATH_STR="${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a"
        mkdir -p build
        cd build
        cmake -DGCOV=on -DCMAKE_BUILD_TYPE=Debug -DXQC_ENABLE_TESTING=1 -DXQC_PRINT_SECRET=1 -DXQC_SUPPORT_SENDMMSG_BUILD=1 -DXQC_ENABLE_EVENT_LOG=1 -DXQC_ENABLE_BBR2=1 -DXQC_ENABLE_RENO=1 -DSSL_TYPE=${SSL_TYPE_STR} -DSSL_PATH=${SSL_PATH_STR} -DSSL_INC_PATH=${SSL_INC_PATH_STR} -DSSL_LIB_PATH=${SSL_LIB_PATH_STR} -DXQC_ENABLE_UNLIMITED=1 -DXQC_ENABLE_COPA=1 -DXQC_COMPAT_DUPLICATE=1 -DXQC_ENABLE_FEC=1 -DXQC_ENABLE_XOR=1 -DXQC_ENABLE_RSC=1 -DXQC_ENABLE_PKM=1 ..
        make -j

    - name: Test
      run: |
        set -o pipefail
        cd build
        keyfile=server.key
        certfile=server.crt
        openssl req -newkey rsa:2048 -x509 -nodes -keyout "$keyfile" -new -out "$certfile" -subj /CN=test.xquic.com
        ./tests/run_tests | tee -a ../xquic_test.log
        gcovr -r .. --xml --gcov-ignore-parse-errors -o ../coverage.xml

    - name: Check Test Result
      run: |
        echo "unit test:"
        cat xquic_test.log | grep "Test:"
        unit_passed=`cat xquic_test.log | grep "Test:" | grep "passed" | wc -l`
        unit_failed=`cat xquic_test.log | grep "Test:" | grep "FAILED" | wc -l`
        echo -e "\033[32m unit test passed:$unit_passed failed:$unit_failed \033[0m\n"

        if [ $unit_failed -eq 0 ] ; then
          echo "===== All unit tests passed! ======"
        else
          echo "====== Find unit test failed! ======"
          exit 1
        fi

    - name: Upload Ubuntu test binaries
      uses: actions/upload-artifact@v4
      with:
        name: xquic-ubuntu-test-binaries
        path: |
          build/tests/test_client
          build/tests/test_server
          build/server.key
          build/server.crt
        retention-days: 1

    - name: Report coverage to Codacy
      shell: bash
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      run: |
        if [ "$CODACY_PROJECT_TOKEN" != "" ] ; then
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        else
          echo "No CODACY_PROJECT_TOKEN provided for Codacy report"
        fi

  case-test-ubuntu:

    name: Case Test on Ubuntu (${{ matrix.shard }})

    needs: build-ubuntu

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: transport-data
          groups: transport.datagram transport.fec observability.qlog
          expected: 81
        - shard: http3-tls-stream
          groups: http3.core transport.stream tls.handshake
          expected: 87
        - shard: core-h3ext
          groups: transport.core http3.ext
          expected: 73
        - shard: multipath-packet-cc
          groups: transport.multipath transport.packet congestion.core
          expected: 64

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2

    - name: Linux runtime setup
      run: |
        sudo apt-get update
        sudo apt-get install -y libevent-dev libcunit1

    - name: Download Ubuntu test binaries
      uses: actions/download-artifact@v4
      with:
        name: xquic-ubuntu-test-binaries
        path: build

    - name: Run case-test shard
      run: |
        set +e
        chmod +x build/tests/test_client build/tests/test_server
        case_args=()
        for group in ${{ matrix.groups }}; do
          case_args+=(--group "$group")
        done
        case_plan="$(bash scripts/case_test.sh --execution-plan "${case_args[@]}")"
        echo "$case_plan"
        planned_cases="$(printf '%s\n' "$case_plan" | awk -F= '/^implemented_unique_cases=/{print $2}')"
        plan_complete="$(printf '%s\n' "$case_plan" | awk -F= '/^complete=/{print $2}')"
        if [ "$plan_complete" != "true" ] || [ "$planned_cases" != "${{ matrix.expected }}" ]; then
          echo "case-test shard plan mismatch: planned=$planned_cases complete=$plan_complete expected=${{ matrix.expected }}"
          exit 1
        fi
        XQC_BUILD_DIR="${PWD}/build" \
          CASE_TEST_CASE_TIMEOUT=300 \
          bash scripts/case_test.sh --execute "${case_args[@]}" --require-complete \
          2>&1 | tee "xquic_case_${{ matrix.shard }}.log"
        case_status=${PIPESTATUS[0]}
        set -e

        case_passed=`grep "pass:" "xquic_case_${{ matrix.shard }}.log" | grep "pass:1" | wc -l`
        case_failed=`grep "pass:" "xquic_case_${{ matrix.shard }}.log" | grep "pass:0" | wc -l`
        echo -e "\033[32m case test shard:${{ matrix.shard }} groups:${{ matrix.groups }} passed:$case_passed failed:$case_failed expected:${{ matrix.expected }} status:$case_status \033[0m\n"

        if [ "$case_status" -ne 0 ] || [ "$case_failed" -ne 0 ] || [ "$case_passed" -ne "${{ matrix.expected }}" ]; then
          echo "====== Find case test failed or missing! ======"
          exit 1
        fi

    - name: Upload case-test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: case-test-${{ matrix.shard }}-logs
        path: |
          xquic_case_${{ matrix.shard }}.log
          build/case_test_parallel/*/case_test.log
        retention-days: 1

  build-macos:

    name: Build on macOS

    needs: harness-check

    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on: [macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        submodules: 'recursive'

    - name: Update Submodule
      run: |
        git submodule update --init --recursive

    - name: Build BoringSSL
      run: |
        git clone https://github.com/google/boringssl.git ./third_party/boringssl
        cd ./third_party/boringssl
        mkdir -p build
        cd build
        cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
        make ssl crypto

    - name: Build XQUIC
      run: |
        SSL_TYPE_STR="boringssl"
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        SSL_INC_PATH_STR="${PWD}/third_party/boringssl/include"
        SSL_LIB_PATH_STR="${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a"
        mkdir -p build
        cd build
        cmake -DPLATFORM=mac -DSSL_TYPE=${SSL_TYPE_STR} -DSSL_PATH=${SSL_PATH_STR} -DSSL_INC_PATH=${SSL_INC_PATH_STR} -DSSL_LIB_PATH=${SSL_LIB_PATH_STR} ..
        make -j
