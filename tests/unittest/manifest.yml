# XQUIC unit-test suite routing.
#
# This metadata is used to plan suite-level CTest registration and opt-in
# parallel execution. The existing run_tests binary remains the compatibility
# entry point until suite selectors are implemented.

version: 1

suites:
  - id: transport.core
    module: transport
    sources:
      - tests/unittest/xqc_cid_test.c
      - tests/unittest/xqc_conn_test.c
      - tests/unittest/xqc_engine_test.c
      - tests/unittest/xqc_retry_test.c
      - tests/unittest/xqc_tp_test.c
      - tests/unittest/xqc_vn_test.c
    port_base: 18000
    port_count: 100

  - id: transport.packet
    module: transport
    sources:
      - tests/unittest/xqc_crypto_frame_test.c
      - tests/unittest/xqc_frame_type_bit_test.c
      - tests/unittest/xqc_packet_test.c
      - tests/unittest/xqc_process_frame_test.c
      - tests/unittest/xqc_recv_record_test.c
      - tests/unittest/xqc_stream_frame_test.c
    port_base: 18100
    port_count: 100

  - id: transport.datagram
    module: transport
    submodule: datagram
    sources:
      - tests/unittest/xqc_datagram_test.c

  - id: transport.send_ctl
    module: transport
    submodule: send_ctl
    sources:
      - tests/unittest/xqc_send_ctl_test.c

  - id: transport.fec
    module: transport
    feature: fec
    sources:
      - tests/unittest/xqc_fec_test.c
      - tests/unittest/xqc_fec_scheme_test.c
      - tests/unittest/xqc_galois_test.c

  - id: tls.crypto
    module: tls
    sources:
      - tests/unittest/xqc_crypto_test.c
      - tests/unittest/xqc_tls_test.c
    port_base: 18200
    port_count: 100

  - id: http3.core
    module: http3
    sources:
      - tests/unittest/xqc_h3_ext_test.c
      - tests/unittest/xqc_h3_test.c

  - id: http3.qpack
    module: http3
    submodule: qpack
    sources:
      - tests/unittest/xqc_dtable_test.c
      - tests/unittest/xqc_encoder_test.c
      - tests/unittest/xqc_qpack_test.c

  - id: congestion.core
    module: congestion_control
    sources:
      - tests/unittest/xqc_cubic_test.c
      - tests/unittest/xqc_pq_test.c
      - tests/unittest/xqc_reno_test.c

  - id: common.core
    module: common
    sources:
      - tests/unittest/xqc_ack_with_timestamp_test.c
      - tests/unittest/xqc_common_test.c
      - tests/unittest/xqc_id_hash_test.c
      - tests/unittest/xqc_prefixed_str_test.c
      - tests/unittest/xqc_random_test.c
      - tests/unittest/xqc_stable_test.c
      - tests/unittest/xqc_vint_test.c
      - tests/unittest/utils/xqc_2d_hash_table_test.c
      - tests/unittest/utils/xqc_huffman_test.c
      - tests/unittest/utils/xqc_ring_array_test.c
      - tests/unittest/utils/xqc_ring_mem_test.c
