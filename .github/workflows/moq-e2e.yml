name: MoQ E2E Tests

on:
  push:
    branches: [main, moq_draft_14_dev, 'moq/draft_18_dev']
    paths:
      - 'moq/**'
      - 'include/moq/**'
      - 'include/xquic/**'
      - 'src/transport/**'
      - 'tests/unittest/**'
      - 'scripts/moq_scripts/**'
      - 'scripts/xquic.lds'
      - 'CMakeLists.txt'
      - '.github/workflows/moq-e2e.yml'
  pull_request:
    branches: [main, moq_draft_14_dev, 'moq/draft_18_dev']
    paths:
      - 'moq/**'
      - 'include/moq/**'
      - 'include/xquic/**'
      - 'src/transport/**'
      - 'tests/unittest/**'
      - 'scripts/moq_scripts/**'
      - 'scripts/xquic.lds'
      - 'CMakeLists.txt'
      - '.github/workflows/moq-e2e.yml'

jobs:
  moq-e2e:
    name: MoQ E2E Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf automake build-essential cmake libcunit1-dev libevent-dev \
          libglib2.0-dev libjansson-dev libssl-dev libtool pkg-config

    - name: Cache BoringSSL
      id: cache-boringssl
      uses: actions/cache@v4
      with:
        path: third_party/boringssl
        key: boringssl-${{ runner.os }}-${{ hashFiles('.gitmodules') }}

    - name: Build BoringSSL
      if: steps.cache-boringssl.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/google/boringssl.git ./third_party/boringssl
        cd ./third_party/boringssl
        mkdir -p build && cd build
        cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
        make -j$(nproc) ssl crypto

    - name: Build XQUIC with MoQ
      run: |
        SSL_TYPE_STR="boringssl"
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        SSL_INC_PATH_STR="${PWD}/third_party/boringssl/include"
        SSL_LIB_PATH_STR="${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a"
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Debug \
              -DXQC_ENABLE_TESTING=1 \
              -DXQC_ENABLE_MOQ=1 \
              -DXQC_PRINT_SECRET=1 \
              -DSSL_TYPE=${SSL_TYPE_STR} \
              -DSSL_PATH=${SSL_PATH_STR} \
              -DSSL_INC_PATH=${SSL_INC_PATH_STR} \
              -DSSL_LIB_PATH=${SSL_LIB_PATH_STR} \
              ..
        make -j$(nproc)

    - name: Build pinned imquic Draft-18 peer
      env:
        IMQUIC_COMMIT: 1f4cbf8a638b80ef40f251fe9787b29f192b0cee
        PICOQUIC_COMMIT: 0dc8ba8b2be30246720934d3f43a144b372e1a90
      run: |
        IMQUIC_ROOT="${PWD}/build/imquic"
        git clone https://github.com/meetecho/imquic.git "${IMQUIC_ROOT}"
        git -C "${IMQUIC_ROOT}" checkout --detach "${IMQUIC_COMMIT}"
        git -C "${IMQUIC_ROOT}" apply \
          "${PWD}/moq/tests/patches/imquic-draft18-lifecycle.patch"

        git clone https://github.com/private-octopus/picoquic.git \
          "${IMQUIC_ROOT}/picoquic"
        git -C "${IMQUIC_ROOT}/picoquic" checkout --detach \
          "${PICOQUIC_COMMIT}"
        cmake -S "${IMQUIC_ROOT}/picoquic" \
          -B "${IMQUIC_ROOT}/picoquic" \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DPICOQUIC_FETCH_PTLS=Y
        cmake --build "${IMQUIC_ROOT}/picoquic" -j"$(nproc)"

        cd "${IMQUIC_ROOT}"
        sh autogen.sh
        ./configure --enable-moq-examples
        make -j"$(nproc)"
        "${GITHUB_WORKSPACE}/moq/tests/check_imquic_draft18_peer.sh" \
          "${IMQUIC_ROOT}"
        bash "${GITHUB_WORKSPACE}/moq/tests/check_imquic_draft18_peer_test.sh" \
          "${IMQUIC_ROOT}"

    # ctest also runs the upstream unittest suite, which loads ./server.key and
    # ./server.crt from the build directory. Generate them first.
    - name: Generate TLS certificates
      run: |
        cd build
        openssl req -x509 -newkey rsa:2048 -nodes \
          -keyout server.key -out server.crt \
          -subj '/CN=localhost' -days 1

    - name: Run upstream unit tests
      run: ctest --test-dir build -R '^run_tests$' --output-on-failure

    - name: Run MoQ CTest targets
      run: |
        ctest --test-dir build \
          -R 'catalog_test|jitter_buffer_test|moq_(message|cancel_write|version)_test|moq_d18_.*_test' \
          --output-on-failure

    - name: Run MoQ E2E tests
      env:
        IMQUIC_ROOT: ${{ github.workspace }}/build/imquic
        XQUIC_BUILD_DIR: ${{ github.workspace }}/build
        MOQ_E2E_LOG_DIR: ${{ github.workspace }}/build/moq-e2e-logs
        MOQ_IMQUIC_LOG_PARENT: ${{ github.workspace }}/build/moq-e2e-logs
      run: |
        DEMO_DIR="${PWD}/build/moq/demo"
        PASS_TOTAL=0
        FAIL_TOTAL=0
        FAILED_TESTS=""

        for test_script in moq/tests/test_*_e2e.sh; do
          echo ""
          echo "========================================"
          echo "Running: $test_script"
          echo "========================================"
          chmod +x "$test_script"
          if bash "$test_script" "$DEMO_DIR"; then
            PASS_TOTAL=$((PASS_TOTAL + 1))
          else
            FAIL_TOTAL=$((FAIL_TOTAL + 1))
            FAILED_TESTS="$FAILED_TESTS $test_script"
          fi
        done

        lifecycle_harness=moq/tests/test_draft18_control_lifecycle_harness.sh
        echo ""
        echo "========================================"
        echo "Running: $lifecycle_harness"
        echo "========================================"
        chmod +x "$lifecycle_harness"
        if bash "$lifecycle_harness" "$DEMO_DIR"; then
          PASS_TOTAL=$((PASS_TOTAL + 1))
        else
          FAIL_TOTAL=$((FAIL_TOTAL + 1))
          FAILED_TESTS="$FAILED_TESTS $lifecycle_harness"
        fi

        echo ""
        echo "========================================"
        echo "MoQ E2E Summary: $PASS_TOTAL scripts passed, $FAIL_TOTAL scripts failed"
        if [ $FAIL_TOTAL -gt 0 ]; then
          echo "Failed: $FAILED_TESTS"
          exit 1
        fi
        echo "All MoQ E2E tests passed!"

    - name: Upload MoQ E2E failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: moq-e2e-logs
        path: build/moq-e2e-logs
        if-no-files-found: ignore
