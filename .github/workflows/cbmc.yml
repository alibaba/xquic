name: CBMC

# Bounded model checking of the parsers that read peer input: the proofs in
# proofs/cbmc. The job runs when those parsers, the helpers they call or the
# proofs change, and on request.

on:
  push:
    branches: [ main ]
    paths:
      - 'src/transport/xqc_frame_parser.*'
      - 'src/transport/xqc_packet_parser.*'
      - 'src/transport/xqc_transport_params.*'
      - 'src/common/utils/vint/**'
      - 'src/common/utils/var_buf/**'
      - 'src/common/utils/huffman/**'
      - 'src/http3/frame/**'
      - 'src/http3/qpack/xqc_prefixed_*'
      - 'src/http3/qpack/xqc_ins.*'
      - 'src/http3/qpack/xqc_rep.*'
      - 'proofs/cbmc/**'
      - '.github/workflows/cbmc.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/transport/xqc_frame_parser.*'
      - 'src/transport/xqc_packet_parser.*'
      - 'src/transport/xqc_transport_params.*'
      - 'src/common/utils/vint/**'
      - 'src/common/utils/var_buf/**'
      - 'src/common/utils/huffman/**'
      - 'src/http3/frame/**'
      - 'src/http3/qpack/xqc_prefixed_*'
      - 'src/http3/qpack/xqc_ins.*'
      - 'src/http3/qpack/xqc_rep.*'
      - 'proofs/cbmc/**'
      - '.github/workflows/cbmc.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The CBMC release the job installs, and the SHA-256 of its Ubuntu 24.04
  # package from https://github.com/diffblue/cbmc/releases.
  CBMC_VERSION: 6.11.0
  CBMC_DEB_SHA256: b3721aa541038384d7801ea3aeabbcddc3e8845ac8f1cbff637cf8dec7481ac8

jobs:

  cbmc:

    name: CBMC proofs

    runs-on: ubuntu-24.04

    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Install CBMC
      timeout-minutes: 5
      run: |
        deb="ubuntu-24.04-cbmc-${CBMC_VERSION}-Linux.deb"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$deb" \
          "https://github.com/diffblue/cbmc/releases/download/cbmc-${CBMC_VERSION}/$deb"
        echo "${CBMC_DEB_SHA256}  $RUNNER_TEMP/$deb" | sha256sum -c -
        sudo apt-get -o Acquire::Retries=3 update
        sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 \
          install -y "$RUNNER_TEMP/$deb" libssl-dev
        cbmc --version

    - name: Run proofs
      run: proofs/cbmc/ci.sh
