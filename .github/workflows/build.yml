name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  harness-check:

    name: Harness Check

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2

    - name: Capture pull request body
      if: github.event_name == 'pull_request'
      env:
        XQC_PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        printf '%s\n' "$XQC_PR_BODY" > "$RUNNER_TEMP/pr_body.md"

    - name: Check agent harness
      run: |
        if [ -f "$RUNNER_TEMP/pr_body.md" ]; then
          XQC_PR_BODY_PATH="$RUNNER_TEMP/pr_body.md" \
            bash harness/scripts/xqc_harness_check.sh
        else
          bash harness/scripts/xqc_harness_check.sh
        fi

  build-ubuntu:

    name: Build on Ubuntu

    needs: harness-check

    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on: [ubuntu-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        submodules: 'recursive'

    - name: Linux Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libevent-dev

    - name: Cunit Setup
      run: |
        sudo apt-get install -y libcunit1 libcunit1-doc libcunit1-dev

    - name: Gcov Setup
      run: |
        sudo apt-get install -y python3-pip
        sudo apt-get install -y python3-lxml
        sudo pip3 install gcovr

    - name: Update Submodule
      run: |
        git submodule update --init --recursive

    - name: Build BoringSSL
      run: |
        git clone https://github.com/google/boringssl.git ./third_party/boringssl
        cd ./third_party/boringssl
        mkdir -p build
        cd build
        cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
        make ssl crypto

    - name: Build XQUIC
      run: |
        SSL_TYPE_STR="boringssl"
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        SSL_INC_PATH_STR="${PWD}/third_party/boringssl/include"
        SSL_LIB_PATH_STR="${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a"
        mkdir -p build
        cd build
        cmake -DGCOV=on -DCMAKE_BUILD_TYPE=Debug -DXQC_ENABLE_TESTING=1 -DXQC_PRINT_SECRET=1 -DXQC_SUPPORT_SENDMMSG_BUILD=1 -DXQC_ENABLE_EVENT_LOG=1 -DXQC_ENABLE_BBR2=1 -DXQC_ENABLE_RENO=1 -DSSL_TYPE=${SSL_TYPE_STR} -DSSL_PATH=${SSL_PATH_STR} -DSSL_INC_PATH=${SSL_INC_PATH_STR} -DSSL_LIB_PATH=${SSL_LIB_PATH_STR} -DXQC_ENABLE_UNLIMITED=1 -DXQC_ENABLE_COPA=1 -DXQC_COMPAT_DUPLICATE=1 -DXQC_ENABLE_FEC=1 -DXQC_ENABLE_XOR=1 -DXQC_ENABLE_RSC=1 -DXQC_ENABLE_PKM=1 ..
        make -j

    - name: Test
      run: |
        set -o pipefail
        cd build
        keyfile=server.key
        certfile=server.crt
        openssl req -newkey rsa:2048 -x509 -nodes -keyout "$keyfile" -new -out "$certfile" -subj /CN=test.xquic.com
        ./tests/run_tests | tee -a ../xquic_test.log
        case_plan="$(bash ../scripts/case_test.sh --execution-plan)"
        echo "$case_plan" | tee -a ../xquic_test.log
        expected="$(printf '%s\n' "$case_plan" | awk -F= '/^implemented_unique_cases=/{print $2}')"
        plan_complete="$(printf '%s\n' "$case_plan" | awk -F= '/^complete=/{print $2}')"
        max_jobs="$(printf '%s\n' "$case_plan" | awk -F= '/^max_safe_jobs=/{print $2}')"
        case_result=0
        if [ "$plan_complete" != "true" ] || [ "$expected" = "" ] || [ "$max_jobs" = "" ]; then
          echo "case-test plan mismatch: expected=$expected complete=$plan_complete max_jobs=$max_jobs" | tee -a ../xquic_test.log
          case_result=1
        else
          set +e
          XQC_BUILD_DIR="${PWD}" \
            CASE_TEST_CASE_TIMEOUT=300 \
            CASE_TEST_SHARD_TIMEOUT=600 \
            bash ../scripts/case_test.sh --execute --parallel --jobs auto --require-complete \
            2>&1 | tee ../xquic_case_test.log
          case_status=${PIPESTATUS[0]}
          set -e

          case_passed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:1$/ {count++} END {print count + 0}' ../xquic_case_test.log)
          case_failed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:0$/ {count++} END {print count + 0}' ../xquic_case_test.log)
          echo -e "\033[32m case test jobs:$max_jobs passed:$case_passed failed:$case_failed expected:$expected status:$case_status \033[0m\n" | tee -a ../xquic_test.log

          if [ "$case_status" -ne 0 ]; then
            echo "case-test runner exited with status $case_status; structured case results decide pass/fail" | tee -a ../xquic_test.log
          fi
          if [ "$case_failed" -ne 0 ] || [ "$case_passed" -ne "$expected" ]; then
            case_result=1
          fi
        fi
        printf '%s\n' "$case_result" > ../xquic_case_status
        find case_test_parallel -type d -name gcov -prune -exec rm -rf {} + 2>/dev/null || true
        gcovr -r .. --xml --gcov-ignore-parse-errors \
          --gcov-ignore-errors=no_working_dir_found -o ../coverage.xml

    - name: Check Test Result
      run: |
        echo "unit test:"
        cat xquic_test.log | grep "Test:"
        unit_passed=`cat xquic_test.log | grep "Test:" | grep "passed" | wc -l`
        unit_failed=`cat xquic_test.log | grep "Test:" | grep "FAILED" | wc -l`
        echo -e "\033[32m unit test passed:$unit_passed failed:$unit_failed \033[0m\n"

        echo "case test:"
        if [ -f xquic_case_test.log ]; then
          cat xquic_case_test.log | grep -E '^\[case-test:[^]]+\] .+ >>>>>>>> pass:' || true
        fi
        case_result=1
        if [ -f xquic_case_status ]; then
          case_result=`cat xquic_case_status`
        fi

        if [ $unit_failed -eq 0 ] && [ "$case_result" -eq 0 ] ; then
          echo "===== All test case passed! ======"
        else
          echo "====== Find test case failed! ======"
          exit 1
        fi

    - name: Upload case-test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: case-test-ubuntu-logs
        path: |
          xquic_case_test.log
          xquic_case_status
          build/case_test_parallel/*/*/case_test.log
          build/case_test_parallel/*/*/case_test.failures
          build/case_test_parallel/*/*/case_test.results
          build/case_test_parallel/*/*/case_test.events
          build/case_test_parallel/*/*/case-output-*.log
          build/case_test_parallel/*/*/case-logs/**
        retention-days: 1

    - name: Report coverage to Codacy
      shell: bash
      env:
        CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
      run: |
        if [ "$CODACY_PROJECT_TOKEN" != "" ] ; then
          bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
        else
          echo "No CODACY_PROJECT_TOKEN provided for Codacy report"
        fi

  build-ubuntu-24-babassl:

    name: Test BabaSSL on Ubuntu 24.04 with GCC 13

    needs: harness-check

    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        submodules: 'recursive'

    - name: Linux Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-13 \
          libcunit1 \
          libcunit1-dev \
          libcunit1-doc \
          libevent-dev \
          openssl \
          psmisc

    - name: Build BabaSSL
      run: |
        git clone --branch 8.3-stable --depth 1 \
          https://github.com/Tongsuo-Project/Tongsuo.git \
          ./third_party/babassl
        cd ./third_party/babassl
        CC=gcc-13 ./config --prefix=/usr/local/babassl
        make -j"$(nproc)" build_libs

    - name: Build XQUIC
      run: |
        SSL_PATH_STR="${PWD}/third_party/babassl"
        SSL_INC_PATH_STR="${SSL_PATH_STR}/include"
        SSL_LIB_PATH_STR="${SSL_PATH_STR}/libssl.a;${SSL_PATH_STR}/libcrypto.a"
        cmake -S . -B build \
          -DCMAKE_C_COMPILER=gcc-13 \
          -DCMAKE_BUILD_TYPE=Release \
          -DXQC_ENABLE_TESTING=1 \
          -DXQC_PRINT_SECRET=1 \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          -DXQC_ENABLE_EVENT_LOG=1 \
          -DXQC_ENABLE_BBR2=1 \
          -DXQC_ENABLE_RENO=1 \
          -DXQC_ENABLE_UNLIMITED=1 \
          -DXQC_ENABLE_COPA=1 \
          -DXQC_COMPAT_DUPLICATE=1 \
          -DXQC_ENABLE_FEC=1 \
          -DXQC_ENABLE_XOR=1 \
          -DXQC_ENABLE_RSC=1 \
          -DXQC_ENABLE_PKM=1 \
          -DSSL_TYPE=babassl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_INC_PATH_STR}" \
          -DSSL_LIB_PATH="${SSL_LIB_PATH_STR}"
        cmake --build build --parallel

    - name: Test
      run: |
        set -o pipefail
        cd build
        keyfile=server.key
        certfile=server.crt
        openssl req -newkey rsa:2048 -x509 -nodes \
          -keyout "$keyfile" \
          -new \
          -out "$certfile" \
          -subj /CN=test.xquic.com
        ./tests/run_tests | tee -a ../xquic_test_ubuntu_24_babassl.log
        case_plan="$(bash ../scripts/case_test.sh --execution-plan)"
        echo "$case_plan" | tee -a ../xquic_test_ubuntu_24_babassl.log
        expected="$(printf '%s\n' "$case_plan" | awk -F= '/^implemented_unique_cases=/{print $2}')"
        plan_complete="$(printf '%s\n' "$case_plan" | awk -F= '/^complete=/{print $2}')"
        max_jobs="$(printf '%s\n' "$case_plan" | awk -F= '/^max_safe_jobs=/{print $2}')"
        case_result=0
        if [ "$plan_complete" != "true" ] || [ "$expected" = "" ] || [ "$max_jobs" = "" ]; then
          echo "case-test plan mismatch: expected=$expected complete=$plan_complete max_jobs=$max_jobs" | tee -a ../xquic_test_ubuntu_24_babassl.log
          case_result=1
        else
          set +e
          XQC_BUILD_DIR="${PWD}" \
            CASE_TEST_CASE_TIMEOUT=300 \
            CASE_TEST_SHARD_TIMEOUT=600 \
            bash ../scripts/case_test.sh --execute --parallel --jobs auto --require-complete \
            2>&1 | tee ../xquic_case_test_ubuntu_24_babassl.log
          case_status=${PIPESTATUS[0]}
          set -e

          case_passed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:1$/ {count++} END {print count + 0}' ../xquic_case_test_ubuntu_24_babassl.log)
          case_failed=$(awk '/^\[case-test:[^]]+\] .+ >>>>>>>> pass:0$/ {count++} END {print count + 0}' ../xquic_case_test_ubuntu_24_babassl.log)
          echo -e "\033[32m case test jobs:$max_jobs passed:$case_passed failed:$case_failed expected:$expected status:$case_status \033[0m\n" | tee -a ../xquic_test_ubuntu_24_babassl.log

          if [ "$case_status" -ne 0 ]; then
            echo "case-test runner exited with status $case_status; structured case results decide pass/fail" | tee -a ../xquic_test_ubuntu_24_babassl.log
          fi
          if [ "$case_failed" -ne 0 ] || [ "$case_passed" -ne "$expected" ]; then
            case_result=1
          fi
        fi
        printf '%s\n' "$case_result" > ../xquic_case_status_ubuntu_24_babassl

    - name: Check Test Result
      run: |
        log_file=xquic_test_ubuntu_24_babassl.log
        unit_total=$(awk '/  Test: / {count++} END {print count + 0}' \
          "$log_file")
        unit_passed=$(awk '/  Test: .*passed/ {count++} END {print count + 0}' \
          "$log_file")
        unit_failed=$(awk '/  Test: .*FAILED/ {count++} END {print count + 0}' \
          "$log_file")
        case_result=1
        if [ -f xquic_case_status_ubuntu_24_babassl ]; then
          case_result=`cat xquic_case_status_ubuntu_24_babassl`
        fi

        echo "unit test total:$unit_total passed:$unit_passed failed:$unit_failed"
        echo "case test result:$case_result"
        if [ -f xquic_case_test_ubuntu_24_babassl.log ]; then
          cat xquic_case_test_ubuntu_24_babassl.log | grep -E '^\[case-test:[^]]+\] .+ >>>>>>>> pass:' || true
        fi

        if [ "$unit_total" -gt 0 ] \
          && [ "$unit_passed" -eq "$unit_total" ] \
          && [ "$unit_failed" -eq 0 ] \
          && [ "$case_result" -eq 0 ]; then
          echo "===== All unit and case tests passed! ====="
        else
          echo "===== Unit or case test failed! ====="
          exit 1
        fi

    - name: Upload BabaSSL case-test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: case-test-ubuntu-24-babassl-logs
        path: |
          xquic_test_ubuntu_24_babassl.log
          xquic_case_test_ubuntu_24_babassl.log
          xquic_case_status_ubuntu_24_babassl
          build/case_test_parallel/*/*/case_test.log
          build/case_test_parallel/*/*/case_test.failures
          build/case_test_parallel/*/*/case_test.results
          build/case_test_parallel/*/*/case_test.events
          build/case_test_parallel/*/*/case-output-*.log
          build/case_test_parallel/*/*/case-logs/**
        retention-days: 1

  build-macos:

    name: Build on macOS

    needs: harness-check

    runs-on: ${{ matrix.runs-on }}

    strategy:
      matrix:
        runs-on: [macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 2
        submodules: 'recursive'

    - name: Update Submodule
      run: |
        git submodule update --init --recursive

    - name: Build BoringSSL
      run: |
        git clone https://github.com/google/boringssl.git ./third_party/boringssl
        cd ./third_party/boringssl
        mkdir -p build
        cd build
        cmake -DBUILD_SHARED_LIBS=0 -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
        make ssl crypto

    - name: Build XQUIC
      run: |
        SSL_TYPE_STR="boringssl"
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        SSL_INC_PATH_STR="${PWD}/third_party/boringssl/include"
        SSL_LIB_PATH_STR="${PWD}/third_party/boringssl/build/libssl.a;${PWD}/third_party/boringssl/build/libcrypto.a"
        mkdir -p build
        cd build
        cmake -DPLATFORM=mac -DSSL_TYPE=${SSL_TYPE_STR} -DSSL_PATH=${SSL_PATH_STR} -DSSL_INC_PATH=${SSL_INC_PATH_STR} -DSSL_LIB_PATH=${SSL_LIB_PATH_STR} ..
        make -j
