name: Static analysis

# Runs clang-tidy, the GCC analyzer and cppcheck over the library sources
# (src/) and fails on any finding that main does not have yet. .clang-tidy
# lists the clang-tidy checks that still report findings on main, with their
# counts; .github/static-analysis/ holds the analyzer's findings on main by
# file and warning, and the cppcheck suppressions. No job links anything:
# they need the BoringSSL headers and a configured build tree only.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The BoringSSL release that the jobs build: a tag, not BoringSSL's main
  # branch, so that a BoringSSL commit cannot break the jobs on its own.
  # Raise it to a newer tag of https://github.com/google/boringssl/tags
  # once the jobs pass with it.
  XQC_BORINGSSL_TAG: 0.20261105.0

jobs:

  clang-tidy:

    name: clang-tidy

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 5
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            clang-20 \
            clang-tidy-20

    - name: Configure XQUIC
      run: |
        git clone --depth 1 --branch "$XQC_BORINGSSL_TAG" \
          https://github.com/google/boringssl.git ./third_party/boringssl
        # Nothing is linked: empty libraries satisfy the configure check.
        mkdir -p third_party/boringssl/build
        touch third_party/boringssl/build/libssl.a third_party/boringssl/build/libcrypto.a
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        cmake -S . -B build \
          -DCMAKE_C_COMPILER=clang-20 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_PRINT_SECRET=1 \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          -DXQC_ENABLE_EVENT_LOG=1 \
          -DXQC_ENABLE_BBR2=1 \
          -DXQC_ENABLE_RENO=1 \
          -DXQC_ENABLE_UNLIMITED=1 \
          -DXQC_ENABLE_COPA=1 \
          -DXQC_COMPAT_DUPLICATE=1 \
          -DXQC_ENABLE_FEC=1 \
          -DXQC_ENABLE_XOR=1 \
          -DXQC_ENABLE_RSC=1 \
          -DXQC_ENABLE_PKM=1 \
          -DXQC_ENABLE_WEBTRANSPORT=1 \
          -DSSL_TYPE=boringssl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_PATH_STR}/include" \
          -DSSL_LIB_PATH="${SSL_PATH_STR}/build/libssl.a;${SSL_PATH_STR}/build/libcrypto.a"
        # The static and the shared library compile the same sources: keep
        # one entry per source file.
        mkdir -p build/clang-tidy
        jq 'unique_by(.file)' build/compile_commands.json \
          > build/clang-tidy/compile_commands.json

    - name: Run clang-tidy
      run: |
        clang-tidy-20 --version
        # The checks of .clang-tidy; any finding fails.
        run-clang-tidy-20 -p build/clang-tidy -j "$(nproc)" -quiet \
          -clang-tidy-binary clang-tidy-20 \
          -warnings-as-errors '*' \
          "${PWD}/src/"

  gcc-analyzer:

    name: GCC analyzer

    runs-on: ubuntu-26.04

    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 5
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            gcc-15

    - name: Configure XQUIC
      run: |
        git clone --depth 1 --branch "$XQC_BORINGSSL_TAG" \
          https://github.com/google/boringssl.git ./third_party/boringssl
        # Nothing is linked: empty libraries satisfy the configure check.
        mkdir -p third_party/boringssl/build
        touch third_party/boringssl/build/libssl.a third_party/boringssl/build/libcrypto.a
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        cmake -S . -B build \
          -DCMAKE_C_COMPILER=gcc-15 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_PRINT_SECRET=1 \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          -DXQC_ENABLE_EVENT_LOG=1 \
          -DXQC_ENABLE_BBR2=1 \
          -DXQC_ENABLE_RENO=1 \
          -DXQC_ENABLE_UNLIMITED=1 \
          -DXQC_ENABLE_COPA=1 \
          -DXQC_COMPAT_DUPLICATE=1 \
          -DXQC_ENABLE_FEC=1 \
          -DXQC_ENABLE_XOR=1 \
          -DXQC_ENABLE_RSC=1 \
          -DXQC_ENABLE_PKM=1 \
          -DXQC_ENABLE_WEBTRANSPORT=1 \
          -DSSL_TYPE=boringssl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_PATH_STR}/include" \
          -DSSL_LIB_PATH="${SSL_PATH_STR}/build/libssl.a;${SSL_PATH_STR}/build/libcrypto.a"

    - name: Run the GCC analyzer
      run: |
        gcc-15 --version | head -n 1
        # Each source file of the library, compiled with -fanalyzer into
        # /dev/null; warnings stay warnings, so that every file reports.
        jq -r '[.[] | select(.file | test("/src/"))] | unique_by(.file) | .[]
          | "cd \(.directory | @sh) && "
            + (.command | sub(" -o [^ ]+ "; " -o /dev/null "))
            + " -fanalyzer -fdiagnostics-plain-output -Wno-error"' \
          build/compile_commands.json \
          | xargs -d '\n' -P "$(nproc)" -I{} sh -c '{}' > build/analyzer.log 2>&1 \
          || { cat build/analyzer.log; exit 1; }
        grep -E '^[^ :]+:[0-9]+:[0-9]+: warning: .* \[-Wanalyzer-[a-z-]+\]$' build/analyzer.log \
          | sed "s#^${PWD}/##" | sort -u > build/analyzer-findings.txt || true
        echo "$(wc -l < build/analyzer-findings.txt) findings"
        # Fail on a file with more findings of a warning than listed.
        awk '
          FNR == NR {
            if ($0 !~ /^#/ && NF == 3) listed[$2 " " $3] = $1
            next
          }
          {
            file = $1
            sub(/:[0-9]+:[0-9]+:$/, "", file)
            warning = $NF
            gsub(/[][]/, "", warning)
            found[file " " warning]++
            lines[file " " warning] = lines[file " " warning] "\n  " $0
          }
          END {
            for (key in found) {
              if (found[key] > listed[key] + 0) {
                printf "::error::%s: %d finding(s), %d listed%s\n",
                  key, found[key], listed[key] + 0, lines[key]
                status = 1
              }
            }
            for (key in listed) {
              if (found[key] + 0 < listed[key]) {
                printf "::notice::%s: %d finding(s), %d listed: lower its count\n",
                  key, found[key] + 0, listed[key]
              }
            }
            exit status
          }
        ' .github/static-analysis/gcc-analyzer.txt build/analyzer-findings.txt

  cppcheck:

    name: cppcheck

    runs-on: ubuntu-24.04

    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Linux Setup
      timeout-minutes: 5
      run: |
        apt_options=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=60
        )
        sudo apt-get "${apt_options[@]}" update
        sudo env DEBIAN_FRONTEND=noninteractive \
          apt-get "${apt_options[@]}" install -y --no-install-recommends \
            cppcheck

    - name: Configure XQUIC
      run: |
        git clone --depth 1 --branch "$XQC_BORINGSSL_TAG" \
          https://github.com/google/boringssl.git ./third_party/boringssl
        # Nothing is linked: empty libraries satisfy the configure check.
        mkdir -p third_party/boringssl/build
        touch third_party/boringssl/build/libssl.a third_party/boringssl/build/libcrypto.a
        SSL_PATH_STR="${PWD}/third_party/boringssl"
        cmake -S . -B build \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=Debug \
          -DXQC_PRINT_SECRET=1 \
          -DXQC_SUPPORT_SENDMMSG_BUILD=1 \
          -DXQC_ENABLE_EVENT_LOG=1 \
          -DXQC_ENABLE_BBR2=1 \
          -DXQC_ENABLE_RENO=1 \
          -DXQC_ENABLE_UNLIMITED=1 \
          -DXQC_ENABLE_COPA=1 \
          -DXQC_COMPAT_DUPLICATE=1 \
          -DXQC_ENABLE_FEC=1 \
          -DXQC_ENABLE_XOR=1 \
          -DXQC_ENABLE_RSC=1 \
          -DXQC_ENABLE_PKM=1 \
          -DXQC_ENABLE_WEBTRANSPORT=1 \
          -DSSL_TYPE=boringssl \
          -DSSL_PATH="${SSL_PATH_STR}" \
          -DSSL_INC_PATH="${SSL_PATH_STR}/include" \
          -DSSL_LIB_PATH="${SSL_PATH_STR}/build/libssl.a;${SSL_PATH_STR}/build/libcrypto.a"
        mkdir -p build/cppcheck
        jq 'unique_by(.file)' build/compile_commands.json \
          > build/cppcheck/compile_commands.json

    - name: Run cppcheck
      run: |
        cppcheck --version
        # The compiler's own target macros: BoringSSL's headers stop at an
        # #error without them.
        # The addon reports calls that are not thread-safe, and static local
        # variables.
        cppcheck --project=build/cppcheck/compile_commands.json \
          -j "$(nproc)" --quiet \
          -D__x86_64 -D__x86_64__ -D__linux__ -D__GNUC__=13 \
          --platform=unix64 --std=c11 \
          --enable=warning,style,performance,portability \
          --addon=threadsafety \
          --suppress=missingIncludeSystem \
          --suppressions-list=.github/static-analysis/cppcheck.supp \
          --error-exitcode=1 \
          --template='{file}:{line}:{column}: {severity}: {message} [{id}]'
