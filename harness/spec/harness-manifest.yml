# XQUIC Harness Manifest
#
# Canonical routing data for agent-facing paths, documentation, validation,
# feature gates, and harness layers. Narrative docs may explain this file but
# should not maintain competing maps.

version: 2

entrypoints:
  project_instructions: harness/spec/PROJECT_INSTRUCTIONS.md
  code_change: harness/pipelines/dev-pipeline.md
  validation: scripts/validate.sh
  harness_check: scripts/xqc_harness_check.sh
  openspec_long_tasks: harness/spec/openspec.md

global_docs:
  architecture:
    - harness/spec/architecture.md
  validation:
    - harness/spec/validation.md
    - harness/skills/validate/SKILL.md
  pull_requests:
    - harness/spec/pull-requests.md
    - harness/skills/xquic-pr-formatting/SKILL.md

modules:
  api:
    paths:
      - include/xquic/*
    read:
      - harness/spec/architecture.md
      - docs/API.md
    update_when:
      public_contract_changed:
        - docs/API.md
        - harness/spec/architecture.md
        - harness/spec/harness-manifest.yml
    validation:
      level: full

  transport:
    paths:
      - src/transport/*
    read:
      - harness/spec/architecture.md
    update_when:
      behavior_or_boundary_changed:
        - harness/spec/architecture.md
        - harness/spec/harness-manifest.yml
    validation:
      level: targeted
    submodules:
      conn:
        paths:
          - src/transport/xqc_conn*
        validation:
          level: full
          hints: [connection, handshake, close]
      engine:
        paths:
          - src/transport/xqc_engine*
        validation:
          level: full
          hints: [connection, handshake]
      stream:
        paths:
          - src/transport/xqc_stream*
        validation:
          level: targeted
          hints: [stream, flow-control]
      packet:
        paths:
          - src/transport/xqc_packet*
        validation:
          level: targeted
          hints: [packet, illegal-packet]
      frame:
        paths:
          - src/transport/xqc_frame*
        validation:
          level: targeted
          hints: [frame, packet]
      send_ctl:
        paths:
          - src/transport/xqc_send_ctl*
        validation:
          level: targeted
          hints: [send, loss, pacing]
      datagram:
        paths:
          - src/transport/xqc_datagram*
        validation:
          level: targeted
          hints: [datagram]
      multipath:
        paths:
          - src/transport/xqc_multipath*
          - src/transport/scheduler/*
          - src/transport/reinjection_control/*
        validation:
          level: targeted
          hints: [multipath, MP, MPNS]
    features:
      fec:
        paths:
          - src/transport/xqc_fec*
          - src/transport/fec_schemes/*
        feature_flags:
          - XQC_ENABLE_FEC=1
          - XQC_ENABLE_XOR=1
          - XQC_ENABLE_RSC=1
          - XQC_ENABLE_PKM=1
        read:
          - harness/spec/architecture.md
          - tests/unittest/xqc_fec_test.c
          - tests/unittest/xqc_fec_scheme_test.c
          - tests/unittest/xqc_galois_test.c
        update_when:
          fec_behavior_or_gate_changed:
            - harness/spec/architecture.md
            - harness/spec/validation.md
            - harness/spec/harness-manifest.yml
        validation:
          level: targeted
          unit: [fec_test, fec_scheme_test, galois_test]
          hints: [fec, repair]

  http3:
    paths:
      - src/http3/*
    read:
      - harness/spec/architecture.md
    update_when:
      behavior_or_api_changed:
        - docs/API.md
        - harness/spec/architecture.md
    validation:
      level: targeted
      hints: [h3, header, settings]
    submodules:
      qpack:
        paths:
          - src/http3/qpack/*
        validation:
          level: targeted
          hints: [qpack]

  tls:
    paths:
      - src/tls/*
    read:
      - harness/spec/architecture.md
      - harness/spec/validation.md
    update_when:
      backend_or_crypto_changed:
        - harness/spec/architecture.md
        - harness/spec/validation.md
    validation:
      level: targeted
      hints: [handshake, cert, 0RTT, 1RTT, key-update]

  congestion_control:
    paths:
      - src/congestion_control/*
    read:
      - harness/spec/architecture.md
    update_when:
      cc_behavior_changed:
        - harness/spec/architecture.md
        - harness/spec/harness-manifest.yml
    validation:
      level: targeted
      hints: [congestion]

  common:
    paths:
      - src/common/*
      - src/common/utils/*
    read:
      - harness/spec/architecture.md
    update_when:
      utility_semantics_changed:
        - harness/spec/architecture.md
        - harness/spec/harness-manifest.yml
    validation:
      level: test

  build:
    paths:
      - CMakeLists.txt
      - cmake/*
      - xqc_configure.h.in
      - scripts/validate.sh
    read:
      - harness/spec/validation.md
    update_when:
      build_behavior_changed:
        - harness/spec/validation.md
        - harness/spec/harness-manifest.yml
    validation:
      level: build

  harness:
    paths:
      - AGENTS.md
      - harness/*
      - scripts/setup_harness.sh
      - scripts/xqc_harness_check.sh
      - .github/workflows/*
    read:
      - harness/README.md
      - harness/spec/PROJECT_INSTRUCTIONS.md
      - harness/spec/harness-manifest.yml
    update_when:
      routing_or_skill_changed:
        - harness/README.md
        - harness/spec/PROJECT_INSTRUCTIONS.md
        - harness/spec/harness-manifest.yml
    validation:
      level: harness
      command: bash scripts/xqc_harness_check.sh

harness_layers:
  strong_injection:
    purpose: "Short root routing and hard constraints."
    files:
      - AGENTS.md
      - harness/spec/PROJECT_INSTRUCTIONS.md
  reusable_skills:
    purpose: "Committed, tool-neutral skill source."
    files:
      - harness/skills/*/SKILL.md
  local_adapters:
    purpose: "Ignored or local tool discovery copies; never the source of truth."
    examples:
      - .agents/skills/
      - .claude/
  machine_checks:
    purpose: "Deterministic validation and harness drift checks."
    files:
      - scripts/validate.sh
      - scripts/xqc_harness_check.sh
